<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c130c">
  <title>阿瓦隆练习场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 74'%3E%3Cpath d='M6 5Q32 0 58 5V33C58 52 46 64 32 70C18 64 6 52 6 33Z' fill='%239e1b2a' stroke='%23d9b45a' stroke-width='5'/%3E%3Cpath d='M32 14v40M20 28h24' stroke='%23f1e4c4' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 共享的 SVG 定义：盾形裁切、金箔描边、高光（不能用 display:none，否则渐变失效） -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="clip-shield" clipPathUnits="userSpaceOnUse">
        <path d="M6 5Q32 0 58 5V33C58 52 46 64 32 70C18 64 6 52 6 33Z"/>
      </clipPath>
      <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e2a2"/>
        <stop offset=".45" stop-color="#c9a24a"/>
        <stop offset=".7" stop-color="#8a6a24"/>
        <stop offset="1" stop-color="#e3c374"/>
      </linearGradient>
      <linearGradient id="g-vellum" x1="0" y1="0" x2=".35" y2="1">
        <stop offset="0" stop-color="#fbefcb"/>
        <stop offset=".55" stop-color="#ead196"/>
        <stop offset="1" stop-color="#c9a456"/>
      </linearGradient>
      <linearGradient id="g-depth" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".5" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".2"/>
      </linearGradient>
      <linearGradient id="g-shine" x1="0" y1="0" x2=".6" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
        <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".75" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".32"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ============ 开局设置 ============ -->
  <section id="setup" class="screen">
    <div class="setup-card paper">
      <form id="setup-form" autocomplete="off">
        <!-- 左页：卷首插画 -->
        <div class="setup-hero">
          <header class="setup-head">
            <div class="crest" data-art="crest" aria-hidden="true"></div>
            <h1>阿瓦隆 <span class="sub">单人练习场</span></h1>
            <div class="flourish" aria-hidden="true"></div>
            <p class="tagline"><span>你 + 一桌由 DeepSeek 扮演的 AI 玩家。</span><span>玩得开心，顺便练练读人。</span></p>
          </header>

          <figure class="lobby">
            <div class="lobby-table" id="lobby-table" aria-hidden="true">
              <div class="lt-center" id="lobby-center"></div>
            </div>
            <figcaption class="lobby-cap" id="lobby-cap"></figcaption>
          </figure>

          <div class="roles-preview" id="roles-preview"></div>

          <ul class="feats">
            <li><span class="feat-ic" data-art="candle" aria-hidden="true"></span><span>教练随时指点</span></li>
            <li><span class="feat-ic" data-art="scroll" aria-hidden="true"></span><span>赛后复盘</span></li>
            <li><span class="feat-ic" data-art="thought" aria-hidden="true"></span><span>看 AI 内心独白</span></li>
          </ul>
        </div>

        <!-- 右页：对局设置 -->
        <div class="setup-main">
          <section class="setup-sec sec-game" aria-labelledby="sec-game-title">
            <h2 class="sec-title" id="sec-game-title">对局设置</h2>
            <div class="grid">
              <label class="field fd-num">人数
                <select name="num_players" id="f-num">
                  <option value="5">5 人</option>
                  <option value="6">6 人</option>
                  <option value="7" selected>7 人</option>
                  <option value="8">8 人</option>
                  <option value="9">9 人</option>
                  <option value="10">10 人</option>
                </select>
              </label>
              <label class="field fd-name">你的昵称
                <input name="name" id="f-name" maxlength="12" placeholder="玩家">
              </label>
              <label class="field fd-seat">你的座位
                <select name="seat" id="f-seat"></select>
              </label>
              <label class="field fd-role"><span class="fd-label">你的角色<small class="fd-off">观战时不需要</small></span>
                <select name="role" id="f-role"></select>
              </label>
              <label class="field fd-len">AI 发言长度
                <select name="speech_len" id="f-len">
                  <option value="50">简短</option>
                  <option value="80" selected>适中</option>
                  <option value="130">详细</option>
                </select>
              </label>
              <label class="toggle fd-lady" title="第2、3、4轮任务后，持有者秘密查验一名玩家的阵营并公开宣布（可以撒谎），仙女随后交给被查验的人">
                <input type="checkbox" name="lady" id="f-lady">
                <span class="tg-badge" data-art="lady" aria-hidden="true"></span>
                <span class="tg-text"><b>湖中仙女</b><small>推荐 7 人以上</small></span>
                <span class="switch" aria-hidden="true"><i></i></span>
              </label>
            </div>
          </section>

          <fieldset class="setup-sec ai-box">
            <legend class="sec-title">AI 玩家</legend>
            <div class="mode-row">
              <label class="mode-card">
                <input type="radio" name="mode" value="llm" checked>
                <span class="mc-ic" data-art="quill" aria-hidden="true"></span>
                <span class="mc-text"><b>DeepSeek</b><small>推荐 · 会聊会演</small></span>
                <span class="mc-seal" data-art="check" aria-hidden="true"></span>
              </label>
              <label class="mode-card">
                <input type="radio" name="mode" value="offline">
                <span class="mc-ic" data-art="scroll" aria-hidden="true"></span>
                <span class="mc-text"><b>离线规则 AI</b><small>免费 · 较笨</small></span>
                <span class="mc-seal" data-art="check" aria-hidden="true"></span>
              </label>
            </div>
            <div id="llm-fields">
              <p class="key-ok" id="server-key-note" hidden><span data-art="check" aria-hidden="true"></span><span><span class="nb">服务器已从 .env 读取了 API Key，</span><span class="nb">这里可以留空。</span></span></p>
              <div class="llm-grid">
                <label class="field fd-key">DeepSeek API Key
                  <span class="key-row">
                    <input type="password" name="api_key" id="f-key" placeholder="sk-...">
                    <button type="button" id="btn-check" class="ghost">测试连接</button>
                  </span>
                </label>
                <label class="field fd-model">模型
                  <input name="model" id="f-model" placeholder="deepseek-chat">
                </label>
              </div>
              <p class="small check-result" id="check-result" aria-live="polite"></p>
              <p class="muted small key-privacy"><span class="nb">Key 只保存在你的浏览器和本机服务里，</span><span class="nb">直接发送给 DeepSeek。</span></p>
            </div>
          </fieldset>

          <div class="start-row">
            <p class="error" id="setup-error" role="alert"></p>
            <button type="submit" class="primary big" id="btn-start"><span class="bs-ic" data-art="swords" aria-hidden="true"></span><span class="bs-label">开始游戏</span></button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ 对局 ============ -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-crest" data-art="crest" aria-hidden="true"></span><span>阿瓦隆</span></div>
      <div class="tracks">
        <div class="track-group">
          <span class="track-label">任务</span>
          <div id="quest-track" class="quest-track"></div>
        </div>
        <div class="reject-wrap" title="本轮连续否决次数，到 5 次坏人直接获胜">
          <span class="track-label">否决</span>
          <div id="reject-track" class="reject-track"></div>
        </div>
      </div>
      <div class="top-actions">
        <span id="usage" class="muted small"></span>
        <button id="btn-rules" class="ghost top-btn"><span class="tb-ic" data-art="scroll" aria-hidden="true"></span><span>规则</span></button>
        <button id="btn-new" class="ghost top-btn"><span class="tb-ic" data-art="restart" aria-hidden="true"></span><span>新游戏</span></button>
      </div>
    </header>

    <main class="board">
      <div class="left">
        <div class="table-wrap">
          <div id="table" class="table">
            <div class="table-center" id="table-center"></div>
          </div>
          <div id="moment" class="moment" aria-live="polite"></div>
        </div>
        <div id="identity" class="identity"></div>
      </div>
      <div class="right paper">
        <div class="log-head">
          <span class="log-title">对局记录</span>
          <label class="tswitch" id="thoughts-toggle" hidden>
            <input type="checkbox" id="show-thoughts">
            <span class="ts-track" aria-hidden="true"><i></i></span>
            <span class="ts-text"><span class="ts-ic" data-art="thought" aria-hidden="true"></span><span class="ts-long">显示 </span>AI 内心独白</span>
          </label>
        </div>
        <div id="log" class="log" role="log" aria-label="对局记录"></div>
        <button type="button" id="log-new" class="log-new" hidden><span data-art="down" aria-hidden="true"></span><span>有新记录</span></button>
      </div>
    </main>

    <div id="sr-turn" class="sr-only" role="status"></div>
    <footer class="action-bar">
      <div id="action" class="action"></div>
      <button id="btn-hint" class="hint-btn" title="让教练根据你能看到的信息给出建议"><span data-art="candle" aria-hidden="true"></span><span class="hint-label">教练</span></button>
    </footer>
  </section>

  <dialog id="modal" class="paper">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="ghost" id="modal-close" aria-label="关闭">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot" hidden></div>
  </dialog>

  <script src="/static/art.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
